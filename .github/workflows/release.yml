name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to publish (for example v0.1.3)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and source identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          node scripts/verify-release.mjs "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Test Windows installer checksum contract
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tests/installers.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          VITE_RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify packaged webview identity
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: node scripts/verify-built-identity.mjs dist/app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag and source identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          node scripts/verify-release.mjs "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Prepare stable names, checksums, and manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: node scripts/prepare-release.mjs "$RELEASE_VERSION"
      - name: Verify published artifact provenance and checksums
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: node scripts/verify-release-artifacts.mjs "${{ github.event.inputs.version || github.ref_name }}" release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Dictation Repair Book ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: release-assets/*
